# App Builder application root for the multi-dam-picker extension's backend: two raw web actions, `api` (every call
# carries an IMS token) and `oauth` (the two browser navigations of the sign-in pop-up; no token, no CORS).
# Secrets are `$NAME` references filled from the untracked .env at deploy time; everything else is a reviewable literal.
application:
  hooks:
    pre-app-deploy: node ../../../shared/worker-template/scripts/pre-deploy-guard.mjs
  runtimeManifest:
    packages:
      multi-dam-picker:
        license: Apache-2.0
        actions:
          api:
            function: actions/api/index.js
            web: raw
            runtime: nodejs:22
            inputs:
              ORG: jazhou-adobe
              # Code sites whose pages may call this worker: the code repo, plus the DA test site that vendors the
              # picker via `npm run package:extension` (comma list).
              SITE: ew-extensions,ew-extensions-demo
              IMS_ORIGIN: https://ims-na1.adobelogin.com
              ALLOWED_IMS_CLIENT_IDS: ''
              STATE_REGION: amer
              ALLOWED_LOCAL_ORIGINS: $ALLOWED_LOCAL_ORIGINS
              # Cloudinary provider. Environment-specific values come from .env; the two credentials are secrets.
              CLOUDINARY_CLOUD_NAME: $CLOUDINARY_CLOUD_NAME
              CLOUDINARY_ROOT_FOLDER: $CLOUDINARY_ROOT_FOLDER
              CLOUDINARY_FOLDER_MODE: $CLOUDINARY_FOLDER_MODE
              CLOUDINARY_SIGN_URLS: $CLOUDINARY_SIGN_URLS
              CLOUDINARY_API_KEY: $CLOUDINARY_API_KEY
              CLOUDINARY_API_SECRET: $CLOUDINARY_API_SECRET
              # Reviewable defaults (change here and redeploy).
              CLOUDINARY_API_HOST: api.cloudinary.com
              CLOUDINARY_SIGNATURE_ALGORITHM: sha1
              CLOUDINARY_ALT_CONTEXT_FIELD: alt
              CLOUDINARY_CAPTION_CONTEXT_FIELD: caption
              CLOUDINARY_ALT_METADATA_FIELD: ''
              CLOUDINARY_RENDITIONS: ''
              CLOUDINARY_DELIVERY_HOSTS: ''
              CLOUDINARY_CACHE_SECONDS: '30'
              # Dropbox provider (per-author OAuth). Blank client id or secret = Dropbox is not offered.
              DROPBOX_CLIENT_ID: $DROPBOX_CLIENT_ID
              DROPBOX_CLIENT_SECRET: $DROPBOX_CLIENT_SECRET
              DROPBOX_ROOT_PATH: $DROPBOX_ROOT_PATH
              DROPBOX_SCOPES: account_info.read files.metadata.read files.content.read sharing.read sharing.write
              DROPBOX_ALT_TEMPLATE_ID: ''
              DROPBOX_ALT_FIELD: ''
              DROPBOX_CACHE_SECONDS: '30'
              # Per-author OAuth host shared by every OAuth provider. Blank = no OAuth provider is offered.
              OAUTH_PUBLIC_BASE_URL: $OAUTH_PUBLIC_BASE_URL
              TOKEN_ENC_KEY: $TOKEN_ENC_KEY
              TOKEN_ENC_KEY_PREVIOUS: $TOKEN_ENC_KEY_PREVIOUS
              OAUTH_STATE_KEY: $OAUTH_STATE_KEY
              CONNECTION_TTL_DAYS: '180'
            annotations:
              web-custom-options: true
              require-adobe-auth: false
              final: true
            limits:
              timeout: 25000
              memory: 256
          oauth:
            function: actions/oauth/index.js
            web: raw
            runtime: nodejs:22
            inputs:
              ORG: jazhou-adobe
              SITE: ew-extensions,ew-extensions-demo
              STATE_REGION: amer
              ALLOWED_LOCAL_ORIGINS: $ALLOWED_LOCAL_ORIGINS
              DROPBOX_CLIENT_ID: $DROPBOX_CLIENT_ID
              DROPBOX_CLIENT_SECRET: $DROPBOX_CLIENT_SECRET
              DROPBOX_ROOT_PATH: $DROPBOX_ROOT_PATH
              DROPBOX_SCOPES: account_info.read files.metadata.read files.content.read sharing.read sharing.write
              OAUTH_PUBLIC_BASE_URL: $OAUTH_PUBLIC_BASE_URL
              TOKEN_ENC_KEY: $TOKEN_ENC_KEY
              TOKEN_ENC_KEY_PREVIOUS: $TOKEN_ENC_KEY_PREVIOUS
              OAUTH_STATE_KEY: $OAUTH_STATE_KEY
              CONNECTION_TTL_DAYS: '180'
            annotations:
              # No `require-adobe-auth`: the pop-up's redirects cannot carry a token. The only unauthenticated action.
              web-custom-options: true
              require-adobe-auth: false
              final: true
            limits:
              timeout: 25000
              memory: 256
